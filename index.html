<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>JARVIS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="mark">J</div>
      <div><h1>JARVIS</h1><p id="status">Tayyor. Buyruqni yozing yoki gapiring.</p></div>
      <span class="live" id="live">● READY</span>
    </header>

    <section class="orb-wrap">
      <button id="mic" class="orb" aria-label="Ovoz bilan buyruq berish">
        <span class="orb-core"></span><span class="orb-ring"></span>
      </button>
      <div class="hint" id="hint">Mikrofon tugmasini bosing</div>
    </section>

    <section class="chat" id="chat" aria-live="polite">
      <div class="msg bot">Assalomu alaykum. Men JARVISman. Buyruq bering yoki savolingizni yozing.</div>
    </section>

    <form id="form" class="composer">
      <input id="input" autocomplete="off" placeholder="Buyruq yoki savol yozing..." />
      <button type="submit">Yuborish</button>
    </form>

    <section class="quick">
      <button data-cmd="Soat necha?">Soat</button>
      <button data-cmd="Bugungi sanani ayt">Sana</button>
      <button data-cmd="YouTube'ni och">YouTube</button>
      <button data-cmd="Google'ni och">Google</button>
      <button id="settings" type="button">AI ulash</button>
    </section>

    <section id="settingsPanel" class="settings-backdrop" hidden>
      <form id="settingsForm" class="settings-card">
        <h2>AI server sozlamasi</h2>
        <label for="workerUrl">Cloudflare Worker HTTPS manzili</label>
        <input id="workerUrl" type="url" placeholder="https://jarvis-api.username.workers.dev" required>
        <label for="accessCode">Maxfiy ulash kodi</label>
        <input id="accessCode" type="password" placeholder="Cloudflare JARVIS_ACCESS_CODE" required autocomplete="off">
        <p id="settingsError" class="settings-error" role="alert"></p>
        <div class="settings-actions">
          <button type="button" id="cancelSettings" class="secondary">Bekor</button>
          <button type="submit">Saqlash</button>
        </div>
        <p class="settings-note">Bu ma’lumotlar faqat shu telefonda saqlanadi. OpenAI API kalitini bu yerga kiritmang.</p>
      </form>
    </section>

    <footer>JARVIS • Android AI yordamchisi</footer>
  </main>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
