<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>JARVIS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="mark">J</div>
      <div><h1>JARVIS</h1><p id="status">Tayyor. Buyruqni yozing yoki gapiring.</p></div>
      <span class="live" id="live">● READY</span>
    </header>

    <section class="orb-wrap">
      <button id="mic" class="orb" aria-label="Ovoz bilan buyruq berish">
        <span class="orb-core"></span><span class="orb-ring"></span>
      </button>
      <div class="hint" id="hint">Mikrofon tugmasini bosing</div>
    </section>

    <section class="chat" id="chat" aria-live="polite">
      <div class="msg bot">Assalomu alaykum. Men JARVISman. Buyruq bering yoki savolingizni yozing. AI server ulangach, siz bilan erkin suhbatlasha olaman.</div>
    </section>

    <form id="form" class="composer">
      <input id="input" autocomplete="off" placeholder="Buyruq yoki savol yozing..." />
      <button type="submit">Yuborish</button>
    </form>

    <section class="quick">
      <button data-cmd="Soat necha?">Soat</button>
      <button data-cmd="Bugungi sanani ayt">Sana</button>
      <button data-cmd="YouTube'ni och">YouTube</button>
      <button data-cmd="Google'ni och">Google</button>
      <button id="settings" type="button">AI ulash</button>
    </section>
    <footer>JARVIS • Android AI yordamchisi</footer>
  </main>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
